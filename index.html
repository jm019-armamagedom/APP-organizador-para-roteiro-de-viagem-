<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planejador de Viagens - Sincronizado</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 min-h-screen font-sans">

    <!-- ================= TELA DE LOGIN / CADASTRO ================= -->
    <div id="auth-screen" class="min-h-screen flex items-center justify-center p-4">
        <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 space-y-6">
            <div class="text-center">
                <h1 class="text-3xl font-bold text-slate-800">✈️ Meu Planejador</h1>
                <p class="text-slate-500 mt-2">Faça login para salvar seus roteiros na nuvem</p>
            </div>

            <!-- Alerta de Erro / Sucesso -->
            <div id="auth-message" class="hidden p-3 rounded-lg text-sm text-center"></div>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">E-mail</label>
                    <input type="email" id="auth-email" placeholder="seu@email.com" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Senha</label>
                    <input type="password" id="auth-password" placeholder="••••••••" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>

                <div class="flex gap-3 pt-2">
                    <button onclick="handleLogin()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition cursor-pointer">
                        Entrar
                    </button>
                    <button onclick="handleSignUp()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 px-4 rounded-lg transition cursor-pointer">
                        Cadastrar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ================= APLICATIVO PRINCIPAL ================= -->
    <div id="app-screen" class="hidden min-h-screen flex flex-col">
        <!-- Topo / Navbar -->
        <header class="bg-white shadow px-6 py-4 flex justify-between items-center">
            <div>
                <h2 class="text-xl font-bold text-slate-800">✈️ Planejador de Viagens</h2>
                <p id="user-email-display" class="text-xs text-slate-500"></p>
            </div>
            <button onclick="handleLogout()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition cursor-pointer">
                Sair
            </button>
        </header>

        <!-- Conteúdo Principal -->
        <main class="flex-1 max-w-4xl w-full mx-auto p-6 space-y-6">
            <div class="bg-white rounded-2xl shadow p-6 space-y-4">
                <h3 class="text-lg font-bold text-slate-700">Seu Roteiro Atual</h3>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Destino</label>
                        <input type="text" id="destination-input" value="Ilhabela, SP" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Categoria</label>
                        <select id="category-input" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <option value="Economic">Economic</option>
                            <option value="Ousado / Premium" selected>Ousado / Premium</option>
                        </select>
                    </div>
                </div>

                <!-- Botão de Sincronizar com o Backend -->
                <div class="pt-4 flex justify-end">
                    <button onclick="saveToCloudDatabase()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-2.5 rounded-lg transition shadow-md cursor-pointer">
                        ☁️ Sincronizar com Servidor
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- ================= LÓGICA DO FRONTEND ================= -->
    <script>
        // Credenciais configuradas do Supabase
        const SUPABASE_URL = 'https://zvrhpaoxhaaxtrqlimml.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp2cmhwYW94aGFheHRycWxpbW1sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwNDg3ODQsImV4cCI6MjEwNjYyNDc4NH0.Zdq6Cp666nsGXKaw43a3oMyLMh5AktILmy0XKW-Du44';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Verifica se já existe sessão ativa ao carregar a página
        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                showApp(session.user);
            }
        });

        // Função de Cadastro
        async function handleSignUp() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;

            const { data, error } = await supabaseClient.auth.signUp({ email, password });
            
            if (error) {
                showAuthMessage(error.message, 'error');
            } else {
                showAuthMessage('Cadastro realizado! Verifique seu e-mail (se necessário) e clique em Entrar.', 'success');
            }
        }

        // Função de Login
        async function handleLogin() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

            if (error) {
                showAuthMessage(error.message, 'error');
            } else {
                showApp(data.user);
            }
        }

        // Função de Logout
        async function handleLogout() {
            await supabaseClient.auth.signOut();
            document.getElementById('app-screen').classList.add('hidden');
            document.getElementById('auth-screen').classList.remove('hidden');
        }

        // Alterna para a tela do app
        function showApp(user) {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            document.getElementById('user-email-display').textContent = `Logado como: ${user.email}`;
        }

        // Mensagens de feedback na autenticação
        function showAuthMessage(text, type) {
            const msgBox = document.getElementById('auth-message');
            msgBox.textContent = text;
            msgBox.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-emerald-100', 'text-emerald-700');
            
            if (type === 'error') {
                msgBox.classList.add('bg-red-100', 'text-red-700');
            } else {
                msgBox.classList.add('bg-emerald-100', 'text-emerald-700');
            }
        }

        // Envia os dados do roteiro para o seu Backend Node.js
        async function saveToCloudDatabase() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            
            if (!session) {
                alert('Você precisa estar logado para sincronizar!');
                return;
            }

            const destination = document.getElementById('destination-input').value;
            const category = document.getElementById('category-input').value;

            const payload = {
                destination: destination,
                category: category,
                itineraryData: {
                    days: [
                        { day: 1, activity: "Chegada e reconhecimento do local" },
                        { day: 2, activity: "Passeio principal e restaurantes" }
                    ]
                }
            };

            try {
                const response = await fetch('http://localhost:3000/api/itinerary', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${session.access_token}` // Envia o token JWT com segurança
                    },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                if (response.ok) {
                    alert('Roteiro sincronizado com sucesso na nuvem!');
                } else {
                    alert('Erro ao sincronizar: ' + (result.error || 'Erro desconhecido'));
                }
            } catch (err) {
                console.error('Erro de conexão com o backend:', err);
                alert('Não foi possível conectar ao servidor backend na porta 3000.');
            }
        }
    </script>
</body>
</html>
